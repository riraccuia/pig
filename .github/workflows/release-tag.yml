name: Release (Tag-Based)
on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.27"
  CGO_ENABLED: "0"
  LDFLAGS: "-s -w"

jobs:
  #test:
  #  name: Test
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Checkout Repository
  #      uses: actions/checkout@v6
  #    - name: Set up Go
  #      uses: actions/setup-go@v7
  #      with:
  #        go-version: ${{ env.GO_VERSION }}
  #    - name: Run Tests
  #      run: go test ./...

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - os: ubuntu-latest
            name: linux-arm6
            goos: linux
            goarch: arm
            goarm: "6"
            ext: ""
          - os: ubuntu-latest
            name: linux-arm7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - os: windows-latest
            name: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ env.CGO_ENABLED }}
        run: |
          go build -ldflags="${{ env.LDFLAGS }}" -o "pig-${{ matrix.name }}${{ matrix.ext }}" ./cmd/pig
          go build -ldflags="${{ env.LDFLAGS }}" -o "signtool-${{ matrix.name }}${{ matrix.ext }}" ./tools/signtool
      - name: Zip
        shell: bash
        run: |
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          $py -m zipfile -c "pig-${{ matrix.name }}.zip" "pig-${{ matrix.name }}${{ matrix.ext }}"
          $py -m zipfile -c "signtool-${{ matrix.name }}.zip" "signtool-${{ matrix.name }}${{ matrix.ext }}"
      - name: Upload Artifact - pig
        uses: actions/upload-artifact@v7
        with:
          path: pig-${{ matrix.name }}.zip
          archive: false
      - name: Upload Artifact - signtool
        uses: actions/upload-artifact@v7
        with:
          path: signtool-${{ matrix.name }}.zip
          archive: false

  release:
    name: Create Release
    #needs: [test, build]
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}