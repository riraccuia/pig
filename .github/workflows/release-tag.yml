name: Release (Tag-Based)
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            goos: "linux"
            goarch: "amd64"
          - os: "windows-latest"
            goos: "windows"
            goarch: "amd64"
          - os: "macos-latest"
            goos: "darwin"
            goarch: "amd64"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
#      - name: Run Tests
#        run: go test ./...
      - name: Build Binary
        run: |
          CGO_ENABLED=0 GOOS=${{matrix.goos}} GOARCH=${{matrix.goarch}} go build -ldflags="-s -w" -o pig-${{matrix.goos}}-${{matrix.goarch}} ./cmd/pig
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pig-${{ matrix.os }}
          path: pig-${{ matrix.os }}-amd64
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pig-*/pig-*
          tag_name: ${{ github.ref_name }}
          body: "Automated release of ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
