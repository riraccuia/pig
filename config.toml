# Server mode configuration
mode = "server"
transport = "quic"
tunnel_ip = "10.0.0.1/24"
mtu = 1300
cert_file = "/path/to/cert.pem"
key_file = "/path/to/key.pem"
stream_count = 5

[target]
address = "0.0.0.0"
port = 8080

